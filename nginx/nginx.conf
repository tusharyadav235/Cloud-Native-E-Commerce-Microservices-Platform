events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        location /api/products {
            proxy_pass http://product-service:8081;
        }

        location /api/cart {
            proxy_pass http://cart-service:8082;
        }

        location /api/orders {
            proxy_pass http://order-service:8083;
        }
    }
}
